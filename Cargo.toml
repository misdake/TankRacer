[workspace]
members = ["crates/assets", "crates/render", "crates/web"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
glam = "0.30"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"
bytemuck = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
